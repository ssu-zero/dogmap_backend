name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        run: |
          set +e
          uv run pytest
          exit_code=$?
          set -e
          # pytest exit code 5 = no tests collected yet, tolerate until tests exist
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 5 ]; then
            exit "$exit_code"
          fi
